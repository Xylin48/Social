name: Social regression tests
on:
  push:
    branches: [main, dev/social-network-overhaul]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active modules
        run: python -m py_compile main.py social.py accounts.py api.py book.py shelf.py posts.py notifi.py settings.py server.py passenger_wsgi.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
