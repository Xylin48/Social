name: Social Python checks
on:
  push:
    branches:
      - dev/social-network-overhaul
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile active modules
        run: python -m compileall -q main.py client.py social.py accounts.py api.py book.py shelf.py posts.py settings.py status.py server.py passenger_wsgi.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
